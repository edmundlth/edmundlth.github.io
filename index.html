<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edmund Lau</title>
  <meta name="description" content="Personal website of Edmund Lau.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: #f7f7f5;
      color: #171717;
    }
    main { width: min(620px, 100%); }
    h1 { margin: 0 0 24px; font-size: clamp(2.6rem, 8vw, 5rem); letter-spacing: -0.055em; line-height: 0.95; }
    .status { margin: 0 0 32px; font-size: 1rem; color: #555; }
    nav { display: flex; gap: 20px; }
    a { color: inherit; text-underline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f1f1ed; }
      .status { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Edmund Lau</h1>
    <p class="status">This site is being rebuilt.</p>
    <nav aria-label="Contact links">
      <a href="https://github.com/edmundlth">GitHub</a>
      <a href="mailto:edmundlth95@gmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
