name: 'Publish holding site'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish holding page
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/holding-index.html
          git checkout --orphan holding-publish
          git rm -rf .
          cp /tmp/holding-index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish temporary holding site"
          git push --force origin HEAD:gh-pages
